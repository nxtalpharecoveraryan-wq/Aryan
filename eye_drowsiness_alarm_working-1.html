<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Eye Siren AI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#05070b;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin-top:25px;
    letter-spacing:3px;
}

p{
    color:#999;
}

#cameraBox{
    width:94%;
    max-width:600px;
    margin:20px auto;
    border-radius:20px;
    overflow:hidden;
    background:#111;
}

video{
    width:100%;
    display:block;
    transform:scaleX(-1);
}

#status{
    width:90%;
    max-width:500px;
    margin:15px auto;
    padding:18px;
    border-radius:15px;
    font-size:24px;
    font-weight:bold;
    background:#172018;
    color:#00ff66;
}

button{
    padding:15px 22px;
    margin:8px;
    border:0;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#start{
    background:#00ff66;
}

#stop{
    background:#ff3333;
    color:white;
}

#message{
    min-height:25px;
    color:#ff4444;
}

.drowsy{
    background:#300808 !important;
    color:#ff3333 !important;
}

.awake{
    background:#082514 !important;
    color:#00ff66 !important;
}
</style>
</head>

<body>

<h1>👁️ EYE SIREN AI</h1>

<p>Close your eyes → Siren ON</p>

<div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
</div>

<div id="status" class="awake">
    CAMERA OFF
</div>

<div id="message"></div>

<button id="start">
    📷 START CAMERA
</button>

<button id="stop">
    🔇 STOP SIREN
</button>


<!-- MediaPipe Face Mesh -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<script>

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const message = document.getElementById("message");

let cameraStream = null;
let sirenOn = false;

let audioContext = null;
let oscillator = null;
let gain = null;

let closedCount = 0;
let openCount = 0;


// ============================
// START BUTTON
// ============================

document.getElementById("start").addEventListener("click", async function(){

    message.innerText = "Starting camera...";

    try{

        // Ask camera permission
        cameraStream = await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user"
            },
            audio:false
        });

        video.srcObject = cameraStream;

        await video.play();

        message.innerText = "Camera started";

        statusBox.innerText = "🟢 AWAKE";
        statusBox.className = "awake";

        // Start FaceMesh
        faceMesh.send({
            image:video
        });

    }
    catch(error){

        console.log(error);

        message.innerText =
        "Camera permission allow karo.";

        statusBox.innerText = "CAMERA ERROR";
    }

});


// ============================
// STOP SIREN BUTTON
// ============================

document.getElementById("stop").addEventListener("click", function(){

    stopSiren();

    message.innerText = "Siren stopped";
});


// ============================
// FACE MESH
// ============================

const faceMesh = new FaceMesh({

    locateFile: function(file){

        return "https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/" + file;
    }

});


faceMesh.setOptions({

    maxNumFaces:1,

    refineLandmarks:true,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5

});


// ============================
// FACE RESULT
// ============================

faceMesh.onResults(function(results){

    if(
        !results.multiFaceLandmarks ||
        results.multiFaceLandmarks.length === 0
    ){

        statusBox.innerText = "FACE NOT FOUND";

        return;
    }

    const face =
    results.multiFaceLandmarks[0];


    // LEFT EYE

    const leftTop = face[159];
    const leftBottom = face[145];
    const leftLeft = face[33];
    const leftRight = face[133];


    // RIGHT EYE

    const rightTop = face[386];
    const rightBottom = face[374];
    const rightLeft = face[362];
    const rightRight = face[263];


    const leftVertical =
        distance(leftTop,leftBottom);

    const leftHorizontal =
        distance(leftLeft,leftRight);


    const rightVertical =
        distance(rightTop,rightBottom);

    const rightHorizontal =
        distance(rightLeft,rightRight);


    const leftRatio =
        leftVertical / leftHorizontal;

    const rightRatio =
        rightVertical / rightHorizontal;


    const eyeRatio =
        (leftRatio + rightRatio) / 2;


    console.log("Eye ratio:",eyeRatio);


    // ============================
    // EYES CLOSED
    // ============================

    if(eyeRatio < 0.20){

        closedCount++;
        openCount=0;


        if(closedCount > 6){

            statusBox.innerText =
            "🔴 EYES CLOSED";

            statusBox.className =
            "drowsy";

            startSiren();
        }

    }


    // ============================
    // EYES OPEN
    // ============================

    else{

        openCount++;
        closedCount=0;


        if(openCount > 3){

            statusBox.innerText =
            "🟢 AWAKE";

            statusBox.className =
            "awake";

            stopSiren();
        }
    }

});


// ============================
// DISTANCE
// ============================

function distance(a,b){

    const x =
        a.x-b.x;

    const y =
        a.y-b.y;

    return Math.sqrt(
        x*x+y*y
    );
}


// ============================
// SIREN
// ============================

function startSiren(){

    if(sirenOn) return;

    sirenOn=true;

    message.innerText =
    "🚨 SIREN ON 🚨";


    audioContext =
    new (
        window.AudioContext ||
        window.webkitAudioContext
    )();


    oscillator =
    audioContext.createOscillator();

    gain =
    audioContext.createGain();


    oscillator.type =
    "sawtooth";


    oscillator.frequency.value =
    900;


    gain.gain.value =
    0.20;


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.start();


    let high=true;


    window.sirenTimer =
    setInterval(function(){

        if(!sirenOn) return;

        oscillator.frequency.value =
        high ? 1300 : 600;

        high=!high;

    },300);

}


// ============================
// STOP SIREN
// ============================

function stopSiren(){

    if(!sirenOn) return;

    sirenOn=false;


    message.innerText="";


    clearInterval(
        window.sirenTimer
    );


    try{

        oscillator.stop();

    }catch(e){}


    try{

        audioContext.close();

    }catch(e){}


    oscillator=null;

    audioContext=null;
}


// ============================
// CAMERA LOOP
// ============================

async function cameraLoop(){

    if(
        cameraStream &&
        video.readyState >= 2
    ){

        await faceMesh.send({
            image:video
        });
    }

    requestAnimationFrame(cameraLoop);
}

cameraLoop();

</script>

</body>
  </html>
